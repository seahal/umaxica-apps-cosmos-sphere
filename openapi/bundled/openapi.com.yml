openapi: 3.0.4
info:
  title: Umaxica JSON API (com surface)
  version: '0'
  contact:
    name: API Support
  description: |
    Machine-facing JSON endpoints served under `/api/v0` on the **com** surface, including the
    machine-readable health and revision endpoints.

    The `app`, `com`, and `org` surfaces are independent trust boundaries served on separate
    hosts, so each has its own description. This one covers the public and corporate surface. An
    endpoint described here exists on this surface's own hosts; it is never shared across surfaces.

    ## What is absent, and why

    Endpoints whose wire format is fixed by another specification -- OAuth 2.0, OIDC, WebAuthn,
    DBSC, MCP (JSON-RPC 2.0), and `.well-known` resources -- are intentionally absent. They are
    governed by their own specifications, not by this contract. The DBSC registration endpoint
    is under `/api/v0/preferences/dbsc` but remains undescribed here because DBSC has its own
    specification. The remaining legacy `/edge/v0` and `/web/v0` endpoints stay absent until they
    converge (adr/api-route-vocabulary-consolidation.md).

    ## Preferences

    `/api/v0/preferences/{cookie,theme,web_push}` is a browser API served by Base on this
    surface, listed in the path's `servers`. Base uses a same-TLD preference token and a host-only browser binding for consent and Web Push;
    a browser calls only the origin it is on; the endpoints are not for cross-origin
    use. The com surface is anonymous: Auth, Core, and Warp serve no preference API on com hosts.

    The text operational endpoints -- `GET /health`, `GET /health/{startup,liveness,readiness}`,
    and `GET /revision` -- are absent because they are not JSON: they render `text/plain` and do
    not negotiate. Only the machine-readable `/api/v0/health.json` and `/api/v0/revision.json`
    endpoints are described here.

    ## Hosts

    `servers` appears only where a host is real, public, and knowable from the repository. The
    preference paths list every host that serves them. The health and revision endpoints carry none
    because they are blocked at the edge. Palm paths carry none because their hosts are supplied by
    deployment environment variables.

    ## Errors

    Most errors use RFC 9457 Problem Details (`application/problem+json`). Duplicate preference
    cookie names are rejected with an empty 400 response. Problem `type` values are
    the stable identifiers clients branch on; `title` and `detail` are human-readable and may
    change. Two extension members are defined: `request_id` and `errors`.

    Some `/api/v0` error responses currently also carry a transitional `error` member that is
    deliberately not described here. It has no known consumer and is scheduled for removal
    (decision D6 in research/rails-nextjs-openapi-contract-audit.md). No schema in this description
    sets `additionalProperties: false`, so clients must tolerate it and any other unknown member.
tags:
  - name: Health
    description: Machine-readable health aggregate and deployment revision. Blocked at the edge, JSON only.
  - name: Preferences
    description: Cookie-consent, color-theme and Web Push JSON endpoints under `/api/v0/preferences`.
paths:
  /api/v0/health.json:
    get:
      summary: Machine-readable health aggregate
      description: 'Internal probe for orchestrators and monitoring, not a user-facing availability contract. Aggregates the startup, liveness, and readiness verdicts into the `pass` / `warn` / `fail` vocabulary. A readiness outage never changes the liveness verdict: liveness is dependency-free. `fail` is served as HTTP 503; `pass` and `warn` as HTTP 200. The body identifies the controller namespace selected by routing and carries no dependency name, exception, path, or environment value.'
      security: []
      operationId: getApiV0Health
      tags:
        - Health
      responses:
        '200':
          description: The instance is serving. `status` is `pass` or `warn`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '406':
          description: The request `Accept` excludes `application/json`. The refusal has an empty body.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '503':
          description: The instance is not serving. `status` is `fail`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /api/v0/revision.json:
    get:
      summary: Machine-readable deployment revision
      description: Returns the deployment revision identifier, or `null` when the deployment has none, together with the RFC 3339 UTC render timestamp. Internal endpoint; no authentication, no database access.
      security: []
      operationId: getApiV0Revision
      tags:
        - Health
      responses:
        '200':
          description: The current deployment revision, or `null`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '406':
          description: The request `Accept` excludes `application/json`. The refusal has an empty body.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
  /api/v0/preferences/cookie:
    servers:
      - url: https://www.umaxica.com
        description: Base public host for the com (public and corporate) surface.
    get:
      summary: Cookie-consent banner state
      description: 'Reports whether the cookie-consent banner should be shown. Open: no session is required. A same-TLD preference token and a matching host-only browser binding identify a recorded decision.'
      operationId: getPreferencesCookie
      tags:
        - Preferences
      security: []
      responses:
        '200':
          description: Banner visibility for this caller.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieBanner'
        '400':
          description: Ambiguous duplicate preference cookies were rejected without a response body.
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      summary: Record cookie consent
      description: 'Records a cookie-consent decision. Open: a caller without a valid preference token receives a new preference. Either `consented` or `cookie.consented` is required; each present flag must be a boolean or one of `1`, `0`, `"1"`, `"0"`, `"true"`, `"false"`, `"t"`, `"f"` (and the upper-case forms), otherwise the request is a 422 naming each field.'
      operationId: patchPreferencesCookie
      tags:
        - Preferences
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required:
                    - consented
                - required:
                    - cookie
              properties:
                consented: {}
                cookie:
                  type: object
                  required:
                    - consented
                  properties:
                    consented: {}
                    functional: {}
                    performant: {}
                    targetable: {}
      responses:
        '200':
          description: Recorded consent choices.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - cookie
                properties:
                  cookie:
                    type: object
                    required:
                      - consented
                      - functional
                      - performant
                      - targetable
                    properties:
                      consented:
                        type: boolean
                      functional:
                        type: boolean
                      performant:
                        type: boolean
                      targetable:
                        type: boolean
        '400':
          description: Malformed JSON or ambiguous duplicate preference cookies.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF verification failed or the browser binding did not match.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v0/preferences/web_push:
    servers:
      - url: https://www.umaxica.com
        description: Base public host for the com surface.
    get:
      summary: Current Web Push preference
      description: Returns disabled when there is no active preference and matching browser binding.
      operationId: getPreferencesWebPush
      tags:
        - Preferences
      security: []
      responses:
        '200':
          description: Current Web Push preference.
          content:
            application/json:
              schema:
                type: object
                required:
                  - web_push
                properties:
                  web_push:
                    type: string
                    enum:
                      - disabled
                      - enabled
        '400':
          description: Ambiguous duplicate preference cookies were rejected without a response body.
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      summary: Update Web Push preference
      operationId: patchPreferencesWebPush
      tags:
        - Preferences
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - web_push
              properties:
                web_push:
                  type: string
                  enum:
                    - disabled
                    - enabled
      responses:
        '200':
          description: Updated Web Push preference.
          content:
            application/json:
              schema:
                type: object
                required:
                  - web_push
                properties:
                  web_push:
                    type: string
                    enum:
                      - disabled
                      - enabled
        '400':
          description: Malformed JSON or ambiguous duplicate preference cookies.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF verification failed or the browser binding did not match.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v0/preferences/theme:
    servers:
      - url: https://www.umaxica.com
        description: Base public host for the com (public and corporate) surface.
    get:
      summary: Current color theme
      description: Reports the caller's color theme. No session is required. A valid same-TLD preference token identifies the preference.
      operationId: getPreferencesTheme
      tags:
        - Preferences
      security: []
      responses:
        '200':
          description: Current theme code.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorTheme'
        '400':
          description: Ambiguous duplicate preference cookies were rejected without a response body.
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      summary: Update color theme
      description: Updates the preference record, creating one when no valid preference token is present. `theme` is `light`, `dark`, or `system` (case-insensitive) or a stored code; any other value, including a missing member, is a 422 with the pointer `/theme`. Unknown members are ignored.
      operationId: patchPreferencesTheme
      tags:
        - Preferences
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - theme
              properties:
                theme:
                  type: string
                  pattern: ^([lL][iI][gG][hH][tT]|[dD][aA][rR][kK]|[sS][yY][sS][tT][eE][mM]|[lL][iI]|[dD][rR]|[sS][yY])$
      responses:
        '200':
          description: Theme after the write.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorTheme'
        '400':
          description: Malformed JSON or ambiguous duplicate preference cookies.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/CsrfVerificationFailed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
components:
  schemas:
    CheckStatus:
      type: object
      description: One check's verdict in the machine-readable health aggregate.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pass
            - warn
            - fail
    HealthReport:
      type: object
      description: Machine-readable health aggregate for `GET /api/v0/health.json`. See docs/reference/health-endpoints.md. Identifies the controller namespace selected by routing and carries the enum-bounded strings `status` and `checks.*.status`; no dependency name, exception, path, or environment value crosses this boundary.
      required:
        - status
        - checks
        - namespace
        - timestamp
      properties:
        status:
          type: string
          description: Worst of the three checks. `fail` is served with HTTP 503; `pass` and `warn` with 200.
          enum:
            - pass
            - warn
            - fail
        checks:
          type: object
          description: Per-check verdicts, mapped independently so a readiness failure never changes the dependency-free liveness verdict.
          required:
            - startup
            - liveness
            - readiness
          properties:
            startup:
              $ref: '#/components/schemas/CheckStatus'
            liveness:
              $ref: '#/components/schemas/CheckStatus'
            readiness:
              $ref: '#/components/schemas/CheckStatus'
        namespace:
          type: string
          pattern: ^[a-z]+/[a-z]+$
          description: The `<frame>/<brand>` controller namespace that handled the request.
        timestamp:
          type: string
          format: date-time
          description: UTC time when Rails rendered the health response, formatted as RFC 3339 with `Z`.
    Revision:
      type: object
      description: Machine-readable deployment revision for `GET /api/v0/revision.json`.
      required:
        - revision
        - timestamp
      properties:
        revision:
          type: string
          nullable: true
          description: The framework-resolved deployment revision (`Rails.application.revision`). Always present as a member; the value is `null` when no revision is configured, which is a normal state. Never a fabricated identifier.
        timestamp:
          type: string
          format: date-time
          description: UTC time when Rails rendered the revision response, formatted as RFC 3339 with `Z`.
    CookieBanner:
      type: object
      required:
        - show_banner
      properties:
        show_banner:
          type: boolean
          description: True when the caller has not recorded cookie consent.
    Problem:
      type: object
      description: RFC 9457 Problem Details. This repository defines exactly two extension members, `request_id` and `errors`; see docs/reference/api-design-standards.md.
      required:
        - type
        - title
        - status
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: Stable problem identifier. Branch on this value, never on title or detail. Clients must not dereference it (RFC 9457 3.1.1). The registry is closed and enforced in code by `ProblemType`, which raises on an unregistered slug.
          enum:
            - urn:umaxica:problem:bad-request
            - urn:umaxica:problem:authentication-required
            - urn:umaxica:problem:token-expired
            - urn:umaxica:problem:authorization-denied
            - urn:umaxica:problem:csrf-verification-failed
            - urn:umaxica:problem:not-found
            - urn:umaxica:problem:method-not-allowed
            - urn:umaxica:problem:not-acceptable
            - urn:umaxica:problem:unsupported-media-type
            - urn:umaxica:problem:validation-failed
            - urn:umaxica:problem:rate-limited
            - urn:umaxica:problem:server-error
            - urn:umaxica:problem:service-unavailable
        title:
          type: string
          description: Stable summary of the type. Not for programmatic use.
        status:
          type: integer
          description: Duplicates the HTTP status code and always agrees with it.
        detail:
          type: string
          description: Occurrence-specific explanation for a human. Absent when there is none.
        instance:
          type: string
          description: Path identifying this occurrence.
        request_id:
          type: string
          description: Request correlation identifier. Always present.
        errors:
          type: array
          description: Field-level validation problems. Present only on 422.
          items:
            type: object
            required:
              - pointer
              - type
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer into the request body.
              type:
                type: string
                format: uri
              detail:
                type: string
    ColorTheme:
      type: object
      required:
        - theme
      properties:
        theme:
          type: string
          description: Stored color-theme code (`li`/`dr`/`sy`) or the canonical option (`light`/`dark`/`system`).
  responses:
    NotAcceptable:
      description: The request `Accept` excludes both `application/json` and `application/problem+json`. The refusal is still sent as a problem document (RFC 9110 15.5.7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: A rate limit was exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. This is the authoritative retry signal; the RateLimit header is informational and may be absent, and no client behaviour may depend on it.
          schema:
            type: integer
        RateLimit:
          schema:
            type: string
            example: '"default";r=0;t=60'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request carries a body whose `Content-Type` is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The body is well-formed JSON but a field is missing or not an accepted value. `errors` names each field with an RFC 6901 JSON Pointer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: An RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfVerificationFailed:
      description: The unsafe request did not pass this host's forgery protection.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
