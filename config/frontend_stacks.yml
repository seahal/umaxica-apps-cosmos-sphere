# Current browser asset ownership. Retained pages render through Action View. Vite supplies surface
# CSS; Edit uses Importmap for Turbo. No retained page mounts Inertia or uses Vite JS.
version: 1
stacks:
  importmap:
    - app/views/layouts/edit/org/application.html.erb
  vite:
    - app/views/docs/app/roots/index.html.erb
    - app/views/docs/com/roots/index.html.erb
    - app/views/docs/org/roots/index.html.erb
    - app/views/news/app/roots/index.html.erb
    - app/views/news/com/roots/index.html.erb
    - app/views/news/org/roots/index.html.erb
    - app/views/help/app/roots/index.html.erb
    - app/views/help/com/roots/index.html.erb
    - app/views/help/org/roots/index.html.erb
    - app/views/info/app/roots/index.html.erb
    - app/views/info/com/roots/index.html.erb
    - app/views/info/org/roots/index.html.erb
    - app/views/layouts/edit/org/application.html.erb
rules:
  importmap: [erb, turbo, stimulus, propshaft]
  vite: [vite, tailwindcss]
